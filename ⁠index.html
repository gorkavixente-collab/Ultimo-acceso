<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Último Acceso - Investigación</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .phone-frame {
            border: 4px solid #333;
            border-radius: 30px;
            padding: 30px;
            max-width: 320px;
            width: 100%;
            background: #161b22;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { font-size: 22px; margin-bottom: 10px; color: #58a6ff; }
        p { font-size: 14px; color: #8b949e; margin-bottom: 20px; }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <h1>ÚLTIMO ACCESO</h1>
        <p>Dispositivo vinculado: Desconocido<br>Estado: Analizando datos...</p>
        <button class="btn" onclick="alert('Iniciando investigación...')">Desbloquear Móvil</button>
    </div>
</body>
</html>
